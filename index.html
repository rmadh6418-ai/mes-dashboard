<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 제조 통합 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .progress-bar-striped { background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent); background-size: 1rem 1rem; }
        /* 팝업(Modal) 숨김 처리용 */
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Navigation & Project Selection -->
    <nav class="bg-slate-800 text-white p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide mb-2 sm:mb-0">MES Dashboard</h1>
            <div class="flex items-center space-x-4">
                <label for="projectSelect" class="text-sm text-slate-300">프로젝트 선택:</label>
                <select id="projectSelect" class="bg-slate-700 text-white px-3 py-1.5 rounded border border-slate-600 focus:outline-none focus:border-blue-400">
                </select>
                <!-- 초기화 버튼 (테스트용) -->
                <button onclick="resetData()" class="text-xs bg-red-600 hover:bg-red-700 px-2 py-1 rounded">초기화</button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- 1. 원가 분석 -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">1. 프로젝트 원가 분석</h2>
            <div class="h-64 relative">
                <canvas id="costChart"></canvas>
            </div>
        </div>

        <!-- 2. 생산일정 진척도 -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">2. 공정별 진척도</h2>
            <div id="scheduleContainer" class="space-y-5">
                <!-- 자바스크립트로 데이터 렌더링 -->
            </div>
        </div>

        <!-- 3. 설계 도면 리비전 -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 lg:col-span-2">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4 space-y-2 sm:space-y-0">
                <h2 class="text-lg font-semibold text-slate-700">3. 도면 리비전 & 4M 이력</h2>
                <div class="flex space-x-2 w-full sm:w-auto">
                    <!-- 도면 검색창 -->
                    <div class="relative w-full sm:w-64">
                        <input type="text" id="searchInput" placeholder="도면번호 또는 파트명 검색..." class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        <span class="absolute right-3 top-2.5 text-gray-400">🔍</span>
                    </div>
                    <!-- 리비전 등록 버튼 -->
                    <button onclick="openModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 whitespace-nowrap font-medium transition">
                        + 리비전 등록
                    </button>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-500">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b">
                        <tr>
                            <th class="px-4 py-3">도면번호</th>
                            <th class="px-4 py-3">파트명</th>
                            <th class="px-4 py-3 text-center">Rev.</th>
                            <th class="px-4 py-3">변경 사유 (ECO)</th>
                            <th class="px-4 py-3">배포일자</th>
                            <th class="px-4 py-3 text-center">상태</th>
                        </tr>
                    </thead>
                    <tbody id="revisionTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 리비전 등록 팝업 (Modal) -->
    <div id="inputModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800">새 도면 리비전 등록</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-800 font-bold text-xl">&times;</button>
            </div>
            <form id="revisionForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">도면번호</label>
                    <input type="text" id="inputDwg" required class="mt-1 w-full px-3 py-2 border rounded focus:ring-blue-500 focus:border-blue-500 text-sm" placeholder="예: DWG-26-NEW01">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">파트명</label>
                    <input type="text" id="inputPart" required class="mt-1 w-full px-3 py-2 border rounded focus:ring-blue-500 focus:border-blue-500 text-sm" placeholder="예: Sensor Bracket">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Revision</label>
                        <input type="text" id="inputRev" required class="mt-1 w-full px-3 py-2 border rounded text-sm" placeholder="예: v1.0">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">배포일자</label>
                        <input type="date" id="inputDate" required class="mt-1 w-full px-3 py-2 border rounded text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">변경 사유 (ECO / 4M)</label>
                    <input type="text" id="inputEco" required class="mt-1 w-full px-3 py-2 border rounded text-sm" placeholder="설계 변경 사유 입력">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">상태</label>
                    <select id="inputStatus" class="mt-1 w-full px-3 py-2 border rounded text-sm">
                        <option value="승인완료">승인완료</option>
                        <option value="검토중">검토중</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-2 pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 text-sm">취소</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 로직 스크립트 -->
    <script>
        let costChartInstance = null;
        let globalData = {}; 
        let currentProject = "";

        // 기본 제공 데이터 (초기 세팅용)
        const defaultData = {
            "OLED 검사 장비": {
                cost: [
                    { 항목: "가공비", 견적원가: 4500, 실행원가: 4800 },
                    { 항목: "구매품", 견적원가: 6200, 실행원가: 6100 },
                    { 항목: "조립/전장", 견적원가: 3100, 실행원가: 3600 }
                ],
                schedule: [
                    { 공정명: "기구/전장 설계", 진척도: 100 },
                    { 공정명: "부품 가공/구매", 진척도: 85 },
                    { 공정명: "UNIT 조립", 진척도: 40 }
                ],
                revision: [
                    { 도면번호: "DWG-26-A01", 파트명: "Main Base", Rev: "v1.2", 변경사유: "하중 보강", 배포일자: "2026-09-20", 상태: "승인완료" },
                    { 도면번호: "DWG-26-B15", 파트명: "Vacuum Suction", Rev: "v2.0", 변경사유: "4M: 재질 변경(GUR)", 배포일자: "2026-09-18", 상태: "승인완료" }
                ]
            },
            "2차전지 패키징 설비": {
                cost: [
                    { 항목: "가공비", 견적원가: 8000, 실행원가: 7500 },
                    { 항목: "구매품", 견적원가: 12000, 실행원가: 11000 },
                    { 항목: "조립/전장", 견적원가: 5000, 실행원가: 4800 }
                ],
                schedule: [
                    { 공정명: "기구/전장 설계", 진척도: 100 },
                    { 공정명: "부품 가공/구매", 진척도: 100 },
                    { 공정명: "UNIT 조립", 진척도: 95 },
                    { 공정명: "FAT 검수", 진척도: 50 }
                ],
                revision: [
                    { 도면번호: "BAT-26-C42", 파트명: "Chamber Cover", Rev: "v1.1", 변경사유: "고어 실란트 치수 수정", 배포일자: "2026-09-22", 상태: "검토중" }
                ]
            }
        };

        // 데이터 불러오기 (로컬 스토리지 확인)
        function loadData() {
            const savedData = localStorage.getItem('mesDashboardData');
            if (savedData) {
                globalData = JSON.parse(savedData);
            } else {
                globalData = JSON.parse(JSON.stringify(defaultData)); // 깊은 복사
            }
        }

        // 데이터 저장하기 (로컬 스토리지 저장)
        function saveData() {
            localStorage.setItem('mesDashboardData', JSON.stringify(globalData));
        }

        // 데이터 완전 초기화
        function resetData() {
            if(confirm("입력한 데이터를 모두 지우고 초기화하시겠습니까?")) {
                localStorage.removeItem('mesDashboardData');
                loadData();
                initDashboard();
            }
        }

        // 대시보드 초기 세팅
        function initDashboard() {
            const projectSelect = document.getElementById('projectSelect');
            projectSelect.innerHTML = '';
            
            Object.keys(globalData).forEach(proj => {
                let option = document.createElement('option');
                option.value = proj;
                option.textContent = proj;
                projectSelect.appendChild(option);
            });

            currentProject = Object.keys(globalData)[0];
            updateDashboard(currentProject);

            // 프로젝트 변경 이벤트
            projectSelect.addEventListener('change', (e) => {
                currentProject = e.target.value;
                document.getElementById('searchInput').value = ''; 
                updateDashboard(currentProject);
            });
        }

        // 전체 대시보드 갱신
        function updateDashboard(projName) {
            const projData = globalData[projName];
            renderChart(projData.cost);
            renderSchedule(projData.schedule);
            renderRevisionTable(projName, document.getElementById('searchInput').value);
        }

        // 차트 렌더링
        function renderChart(costData) {
            const labels = costData.map(d => d.항목);
            const planData = costData.map(d => d.견적원가);
            const actualData = costData.map(d => d.실행원가);

            if (costChartInstance) costChartInstance.destroy();
            const ctx = document.getElementById('costChart').getContext('2d');
            costChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '견적 원가', data: planData, backgroundColor: 'rgba(148, 163, 184, 0.5)', borderColor: 'rgba(148, 163, 184, 1)', borderWidth: 1 },
                        { label: '실행 원가', data: actualData, backgroundColor: 'rgba(59, 130, 246, 0.7)', borderColor: 'rgba(37, 99, 235, 1)', borderWidth: 1 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // 일정 렌더링
        function renderSchedule(scheduleData) {
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = '';
            scheduleData.forEach(item => {
                const colorClass = item.진척도 === 100 ? 'bg-green-500' : (item.진척도 > 0 ? 'bg-blue-500 progress-bar-striped' : 'bg-gray-300');
                const textClass = item.진척도 === 100 ? 'text-green-600' : (item.진척도 > 0 ? 'text-blue-600' : 'text-gray-400');
                
                const html = `
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="font-medium text-gray-700">${item.공정명}</span>
                        <span class="${textClass} font-bold">${item.진척도}%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div class="${colorClass} h-2.5 rounded-full" style="width: ${item.진척도}%"></div>
                    </div>
                </div>`;
                container.innerHTML += html;
            });
        }

        // 리비전 테이블 렌더링
        function renderRevisionTable(projName, keyword) {
            const tbody = document.getElementById('revisionTableBody');
            tbody.innerHTML = '';
            const revData = globalData[projName].revision;
            
            const filteredData = revData.filter(item => 
                item.도면번호.toLowerCase().includes(keyword.toLowerCase()) || 
                item.파트명.toLowerCase().includes(keyword.toLowerCase())
            );

            if(filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-gray-500">데이터가 없습니다.</td></tr>`;
                return;
            }

            // 최신 데이터가 위로 오게 역순으로 렌더링
            [...filteredData].reverse().forEach(item => {
                const statusColor = item.상태.includes('완료') ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
                const html = `
                <tr class="bg-white border-b hover:bg-gray-50">
                    <td class="px-4 py-3 font-medium text-gray-900">${item.도면번호}</td>
                    <td class="px-4 py-3">${item.파트명}</td>
                    <td class="px-4 py-3 text-center font-bold text-blue-600">${item.Rev}</td>
                    <td class="px-4 py-3">${item.변경사유}</td>
                    <td class="px-4 py-3">${item.배포일자}</td>
                    <td class="px-4 py-3 text-center"><span class="${statusColor} text-xs font-medium px-2 py-1 rounded">${item.상태}</span></td>
                </tr>`;
                tbody.innerHTML += html;
            });
        }

        // 검색 이벤트
        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            renderRevisionTable(currentProject, e.target.value);
        });

        // 팝업(Modal) 제어
        function openModal() {
            document.getElementById('inputDate').valueAsDate = new Date(); // 오늘 날짜 기본 세팅
            document.getElementById('inputModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('inputModal').classList.add('hidden');
            document.getElementById('revisionForm').reset();
        }

        // 폼 제출(데이터 추가) 이벤트
        document.getElementById('revisionForm').addEventListener('submit', function(e) {
            e.preventDefault(); // 페이지 새로고침 방지

            const newData = {
                도면번호: document.getElementById('inputDwg').value,
                파트명: document.getElementById('inputPart').value,
                Rev: document.getElementById('inputRev').value,
                변경사유: document.getElementById('inputEco').value,
                배포일자: document.getElementById('inputDate').value,
                상태: document.getElementById('inputStatus').value
            };

            // 현재 프로젝트의 revision 배열에 데이터 추가
            globalData[currentProject].revision.push(newData);
            
            saveData(); // 로컬 스토리지에 저장
            updateDashboard(currentProject); // 화면 갱신
            closeModal(); // 팝업 닫기
            
            alert('성공적으로 등록되었습니다!');
        });

        // 페이지 로드 시 실행
        document.addEventListener("DOMContentLoaded", () => {
            loadData();
            initDashboard();
        });
    </script>
</body>
</html>
